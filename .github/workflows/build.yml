name: Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle (dependencies and build cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Kotlin (buildSrc)
        uses: actions/cache@v4
        with:
          path: |
            buildSrc/build
            buildSrc/.gradle
          key: kotlin-buildsrc-${{ runner.os }}-${{ hashFiles('buildSrc/**/*.kt', 'buildSrc/**/*.kts', 'buildSrc/**/*.gradle') }}

      - name: Native sources hash
        id: jni
        run: echo "h=$(git rev-parse HEAD:TMessagesProj/jni)" >> "$GITHUB_OUTPUT"

      - name: Cache native build (C++)
        id: cxxcache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: cxx-v2-${{ runner.os }}-${{ steps.jni.outputs.h }}

      - name: Keep cached native objects valid
        if: steps.cxxcache.outputs.cache-hit == 'true'
        run: find TMessagesProj/jni -type f -exec touch -d '2001-01-01' {} +

      - name: Accept licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Set package name
        run: |
          sed -i -E 's/^APP_PACKAGE *=.*/APP_PACKAGE=com.truegram/' gradle.properties
          grep -n "APP_PACKAGE" gradle.properties

      - name: Restrict ABI to arm64
        run: |
          grep -rl "abiFilters" --include=build.gradle --include=build.gradle.kts . | xargs -r sed -i -E 's/abiFilters .*/abiFilters "arm64-v8a"/'
          echo "--- abiFilters after edit:"
          grep -rn "abiFilters" --include=build.gradle --include=build.gradle.kts .

      - name: Restrict native build to arm64 (library)
        run: |
          sed -i '/minSdkVersion 23/a\        ndk { abiFilters "arm64-v8a" }' TMessagesProj/build.gradle
          grep -n -B1 "abiFilters" TMessagesProj/build.gradle

      - name: Make debug build non-debuggable
        run: |
          sed -i -E 's/^([[:space:]]*)(jniDebuggable|debuggable) true/\1\2 false/' TMessagesProj_AppStandalone/build.gradle
          grep -n "ebuggable" TMessagesProj_AppStandalone/build.gradle

      - name: Restore signing key
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > TMessagesProj/config/release.keystore
          ls -l TMessagesProj/config/release.keystore

      - name: Apply custom icon
        run: |
          set -e
          if ! command -v convert >/dev/null; then
            for i in 1 2 3; do
              sudo apt-get update -y && sudo apt-get install -y imagemagick && break
              echo "apt попытка $i не удалась, повтор через 20 с"; sleep 20
            done
          fi
          ICON=file_0000000047a881f4b2d2a66902d1511e.png
          test -f "$ICON"
          ALPHA=$(convert "$ICON" -format "%[fx:p{0,0}.a]" info:)
          if [ "$(awk -v a="$ALPHA" 'BEGIN{print (a>0.5)?1:0}')" = "1" ]; then
            BG="#$(convert "$ICON" -format "%[hex:p{0,0}]" info: | cut -c1-6)"
          else
            BG="#FFFFFF"
          fi
          echo "icon background: $BG"
          S=TMessagesProj_AppStandalone/src/main/res
          M=TMessagesProj/src/main/res
          mkdir -p $M/values $S/mipmap-anydpi-v26 $M/mipmap-anydpi-v26
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><color name=\"truegram_icon_bg\">$BG</color></resources>" > $M/values/truegram_colors.xml
          for pair in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            D=${pair%%:*}; REST=${pair#*:}; N=${REST%%:*}; F=${REST#*:}
            R=$((N/2)); INNER=$((F*90/100))
            mkdir -p $S/mipmap-$D $M/mipmap-$D
            convert "$ICON" -resize ${N}x${N} -define png:exclude-chunks=date,time PNG32:$S/mipmap-$D/ic_launcher_sa.png
            convert "$ICON" -resize ${N}x${N} -define png:exclude-chunks=date,time PNG32:$M/mipmap-$D/ic_launcher.png
            convert "$ICON" -resize ${N}x${N} -alpha set \( -size ${N}x${N} xc:none -fill white -draw "circle $R,$R $R,0" \) -compose DstIn -composite -define png:exclude-chunks=date,time PNG32:$M/mipmap-$D/ic_launcher_round.png
            convert -size ${F}x${F} xc:none \( "$ICON" -resize ${INNER}x${INNER} \) -gravity center -composite -define png:exclude-chunks=date,time PNG32:$M/mipmap-$D/truegram_fg.png
          done
          for X in $S/mipmap-anydpi-v26/ic_launcher_sa.xml $M/mipmap-anydpi-v26/ic_launcher.xml $M/mipmap-anydpi-v26/ic_launcher_round.xml; do
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '    <background android:drawable="@color/truegram_icon_bg"/>' \
              '    <foreground android:drawable="@mipmap/truegram_fg"/>' \
              '</adaptive-icon>' > "$X"
          done

      - name: Build arm64 debug
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.KS_PASS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.KS_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew :TMessagesProj_AppStandalone:assembleDebug \
              --build-cache --no-daemon && exit 0
            echo "Попытка $i не удалась, повтор через 60 с"
            sleep 60
          done
          exit 1

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Show icon and package
        run: |
          APK=$(find . -path "*build/outputs/apk/afat/debug*" -name "*.apk" | head -1)
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -m3 "package:\|application-icon" || true

      - name: Diagnose APK
        run: |
          BT=$ANDROID_HOME/build-tools/36.0.0
          APK=$(find . -path "*build/outputs/apk/afat/debug*" -name "*.apk" | head -1)
          echo "=== $APK"
          $BT/apksigner verify -v --print-certs "$APK" | head -15 || true
          $BT/zipalign -c -v 4 "$APK" | tail -3 || true
          unzip -v "$APK" | grep -E "resources.arsc|AndroidManifest" || true
          $BT/aapt dump xmltree "$APK" AndroidManifest.xml | grep -i debuggable || echo "debuggable: not set"
          if $BT/aapt dump xmltree "$APK" AndroidManifest.xml | grep -qi testOnly; then
            echo "ERROR: APK is testOnly"; exit 1
          else
            echo "testOnly: NO"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-arm64-apk
          path: "**/build/outputs/apk/afat/debug/*.apk"
          if-no-files-found: error
