name: Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK/CMake
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;21.4.7075529" "cmake;3.10.2.4988404" "platforms;android-35" "build-tools;35.0.0"

      - name: Build arm64 only
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandaloneDebug \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon

      - name: Find APK
        run: find . -name "*.apk" -type f

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-arm64-apk
          path: "**/*.apk"
          if-no-files-found: error
